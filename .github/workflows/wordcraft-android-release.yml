name: Build and release WordCraft Android APK

# Builds the newest upstream WordCraft (storytold/wordcraft) with the Android layer
# applied on top, then publishes the APK as a GitHub Release.
# It only builds when upstream has something new (or when you run it by hand).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch or tag to build (empty = main)"
        required: false
        default: ""
      force:
        description: "Build again even if this upstream version already has a release"
        type: boolean
        default: false
      publish:
        description: "Publish a release (uncheck to just build and attach the APK to this workflow run, for trying a change before it goes out)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/wordcraft
  TARGET: aarch64-linux-android
  NDK_VERSION: 28.2.13676358
  BT_VERSION: 35.0.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Pick the upstream ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          VAR_REF: ${{ vars.UPSTREAM_REF }}
        run: |
          REF="${INPUT_REF:-${VAR_REF:-main}}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out this repository (the Android layer lives here)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream WordCraft
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: src

      - name: Work out the release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # One release per upstream version. Later commits, or changes to the Android layer, do not make a new
          # release of the same version; to rebuild one, run the workflow with "force". With "publish" unchecked
          # there's no release to collide with, so every run just builds (see the "publish" input's own
          # description); that's also what a plain schedule trigger does, since inputs.publish is then empty.
          VER=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
          SHA=$(git -C src rev-parse --short=7 HEAD)
          TAG="android-v${VER}"
          {
            echo "version=$VER"
            echo "sha=$SHA"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "${PUBLISH:-true}" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG already exists - nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the Android layer on top of upstream
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/layer"
          tar xzf ../fork/android-layer/wordcraft-android-layer.tar.gz -C "$RUNNER_TEMP/layer"
          python3 "$RUNNER_TEMP/layer/apply_layer.py"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Rust version upstream asks for
        if: steps.ver.outputs.skip != 'true'
        run: |
          # egui 0.36 needs Rust 1.95 even where the workspace still says 1.90: never go below it.
          RUSTV=$(grep -m1 '^rust-version' src/Cargo.toml | cut -d'"' -f2)
          RUSTV=$(printf '%s\n%s\n' "${RUSTV:-1.95}" "1.95" | sort -V | tail -n1)
          rustup toolchain install "$RUSTV" --profile minimal --target "$TARGET"
          rustup default "$RUSTV"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src
          key: android-arm64

      - name: Install Android SDK parts
        if: steps.ver.outputs.skip != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;${BT_VERSION}" "ndk;${NDK_VERSION}"

      - name: Build native library (Rust)
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo build -p wordcraft-android --target "$TARGET" --release -j 3

      - name: Restore signing key
        if: steps.ver.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/wordcraft-signing
          key: wordcraft-signing-v1

      - name: Create signing key if missing
        if: steps.ver.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/wordcraft-signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ~/wordcraft-signing/key.p12
            printf '%s' "$KS_PASS" > ~/wordcraft-signing/password.txt
          elif [ ! -f ~/wordcraft-signing/key.p12 ]; then
            openssl rand -base64 24 > ~/wordcraft-signing/password.txt
            keytool -genkeypair -keystore ~/wordcraft-signing/key.p12 -storetype PKCS12 \
              -storepass:file ~/wordcraft-signing/password.txt -alias wordcraft \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=WordCraft Personal Android Build"
          fi

      - name: Package and sign the APK
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BT_VERSION}"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          B="$RUNNER_TEMP/apk"
          mkdir -p "$B/classes" "$B/dex" "$B/res/drawable" dist
          cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.wordcraft.png "$B/res/drawable/icon.png"

          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d "$B/classes" \
            packaging/android/java/ai/storyteller/wordcraft/*.java
          jar cf "$B/classes.jar" -C "$B/classes" .
          "$BT/d8" --release --min-api 28 --lib "$PLATFORM" --output "$B/dex" "$B/classes.jar"
          "$BT/aapt2" compile --dir "$B/res" -o "$B/resources.zip"
          "$BT/aapt2" link -I "$PLATFORM" --manifest packaging/android/AndroidManifest.xml \
            --version-code "$(( $(date +%s) / 60 ))" --version-name "${TAG}" \
            -o "$B/unsigned.apk" "$B/resources.zip"

          B="$B" LIB="target/${TARGET}/release/libwordcraft_android.so" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          b = Path(os.environ["B"])
          with zipfile.ZipFile(b / "unsigned.apk", "a", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(b / "dex/classes.dex", "classes.dex")
              z.write(os.environ["LIB"], "lib/arm64-v8a/libwordcraft_android.so")
              for p in ["LICENSE-MIT", "LICENSE-APACHE", "ATTRIBUTION.md",
                        "assets/app-icon/LICENSE.txt", "vendor/winit/LICENSE", "vendor/winit-android/LICENSE",
                        *map(str, sorted(Path("assets/fonts").glob("*.txt")))]:
                  if Path(p).exists():
                      z.write(p, "assets/licenses/" + p.replace("/", "_"))
          PY

          "$BT/zipalign" -f -P 16 4 "$B/unsigned.apk" "$B/aligned.apk"
          APK="dist/WordCraft-${VERSION}-android-arm64-v8a.apk"
          "$BT/apksigner" sign --ks ~/wordcraft-signing/key.p12 --ks-key-alias wordcraft \
            --ks-pass "file:$HOME/wordcraft-signing/password.txt" --out "$APK" "$B/aligned.apk"
          "$BT/apksigner" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload the APK as a build artifact (publish unchecked - no release)
        if: steps.ver.outputs.skip != 'true' && inputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}
          path: src/dist/*.apk
          retention-days: 14

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true' && inputs.publish != 'false'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # The upstream release's own notes, for this version (its GitHub release, by its tag).
          if gh release view "v${VERSION}" --repo "$UPSTREAM" --json body --jq .body > upstream-raw.md 2>/dev/null && [ -s upstream-raw.md ]; then
            # Drop GitHub's auto-generated "New Contributors" section (and the "Full Changelog" compare
            # link under it), and the "by @user in <PR link>" attribution GitHub appends to every bullet:
            # this is WordCraft's own release, not upstream's, so it lists upstream's code changes, not who
            # made them or joined upstream's project.
            awk '
              /^#+[ \t]*New Contributors[ \t]*$/ { skip = 1; next }
              /^#+[ \t]/ { skip = 0 }
              !skip
            ' upstream-raw.md | sed -E 's/ by @[^ ]+ in [^ ]+[[:space:]]*$//' > upstream-notes.md
            UPSTREAM_NOTES=upstream-notes.md
          else
            printf 'Upstream has no release notes for v%s yet.\n' "$VERSION" > upstream-notes.md
            UPSTREAM_NOTES=upstream-notes.md
          fi
          cat > notes.md <<NOTES
          **WordCraft ${VERSION} for Android** (early preview, ARM64)

          Built automatically from upstream \`${UPSTREAM}\` at \`${REF}\` (commit \`${SHA}\`) with the Android layer applied. This is an early preview: a hardware keyboard is recommended, and documents open and save through the built-in file browser (turn on Settings > Apps > WordCraft > Permissions > Files > All files access).

          - Needs an ARM64 phone or tablet running Android 9 or newer.
          - Download the \`.apk\`, open it, and allow installs from your file manager or browser when Android asks.
          - Unofficial build, not made or supported by the WordCraft team. If an update will not install over an older build, uninstall the old one first.
          NOTES
          { echo; echo "## WordCraft ${VERSION} changes (upstream)"; echo; cat "$UPSTREAM_NOTES"; } >> notes.md
          # Android-only changes: the topmost "## ..." section of whats-new.md, whatever its heading says.
          # Matching the heading text against $VERSION broke silently the moment upstream shipped a version
          # newer than the heading already in the file (0.14.0 released while the file still said "## 0.13.2"):
          # the awk found no match, so the whole Android section was dropped from that release with no error.
          # Going by position instead means the heading's own wording never has to predict the next upstream
          # version in advance. "Entries under an old heading never appear again" still holds: add a new
          # heading above the current one before writing the next batch, and the old one becomes unreachable.
          ANDROID=$(awk '/^## / { if (seen) exit; seen = 1; next } seen' "$RUNNER_TEMP/layer/whats-new.md" 2>/dev/null)
          if [ -n "$(printf '%s' "$ANDROID" | tr -d '[:space:]')" ]; then
            # Belt-and-braces on top of the position-based extraction above: tag this section with a hash of
            # its own text, and skip it if the most recent android-v* release already carries that same hash.
            # The position rule already keeps entries from being written twice in whats-new.md itself, so this
            # only catches re-running the workflow (e.g. with "force") before whats-new.md gets a new heading,
            # which would otherwise publish the identical Android section again under a second release.
            HASH=$(printf '%s' "$ANDROID" | sha1sum | cut -d' ' -f1)
            MARKER="<!-- android-news:${HASH} -->"
            PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json tagName \
              --jq '.[] | select(.tagName | startswith("android-v")) | .tagName' | head -n1)
            ALREADY_PUBLISHED=false
            if [ -n "$PREV_TAG" ] && gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
                --json body --jq .body 2>/dev/null | grep -qF "$MARKER"; then
              ALREADY_PUBLISHED=true
            fi
            if [ "$ALREADY_PUBLISHED" != "true" ]; then
              { echo; echo "## Android changes in ${VERSION}"; echo; printf '%s\n' "$ANDROID"; echo; echo "$MARKER"; } >> notes.md
            fi
          fi
          # By this point the build has already run for ~100+ minutes; GitHub's API occasionally 502s for
          # a moment, and that's a bad time to let one blip throw the whole run away, so this one retries.
          # A 502 can also land after the release was actually created server-side (the request succeeded,
          # only its response got lost), so each retry first checks whether $TAG already exists before
          # trying "create" again, rather than erroring out over a release that's actually there.
          n=0
          until gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "WordCraft ${VERSION} Android" --notes-file notes.md; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "release $TAG exists already (the create call's own response just didn't come back); treating it as done"
              break
            fi
            n=$((n + 1))
            [ "$n" -ge 4 ] && { echo "::error::gh release create failed after $n attempts"; exit 1; }
            echo "::warning::gh release create failed (attempt $n/4), retrying in $((n * 10))s"
            sleep $((n * 10))
          done

      - name: Keep the README's Android features list current
        if: steps.ver.outputs.skip != 'true' && inputs.publish != 'false'
        working-directory: fork
        run: |
          # Not a changelog (that's whats-new.md, and the release notes above): every feature the Android
          # build has gained stays listed here, so the README always describes what today's build can do,
          # without anyone having to remember to update it by hand. Regenerated on every successful release
          # from the full whats-new.md (every "## ..." section, not just the newest one), so an entry keeps
          # appearing here even once it has stopped appearing in new release notes.
          START='<!-- android-features:start -->'
          END='<!-- android-features:end -->'
          if ! grep -qF "$START" README.md; then
            {
              echo
              echo "## WordCraft for Android"
              echo
              echo "An unofficial Android build is published automatically from this fork's \`android-v*\` [releases](https://github.com/${GITHUB_REPOSITORY}/releases). What it can do:"
              echo
              echo "$START"
              echo "$END"
            } >> README.md
          fi
          FEATURES=$(grep '^- ' "$RUNNER_TEMP/layer/whats-new.md")
          awk -v start="$START" -v end="$END" -v features="$FEATURES" '
            $0 == start { print; print features; skip = 1; next }
            $0 == end { skip = 0 }
            !skip
          ' README.md > README.md.new
          mv README.md.new README.md
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update the Android features list in README [skip ci]"
            git fetch origin main
            git push origin HEAD:main || echo "::warning::couldn't push the README update (the branch moved meanwhile); update README.md by hand"
          fi
